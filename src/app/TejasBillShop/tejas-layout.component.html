<div class="tejas-layout min-h-screen bg-[#FDF6F0] relative pb-20 font-sans">
  <!-- TOP HEADER BAR WITH SHOP SELECTOR (SUPERADMIN ONLY) -->
  <header *ngIf="isSuperAdmin" class="bg-white sticky top-0 z-40 border-b border-[#F0E6DD] px-3 px-md-4 py-2.5 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
      <!-- Brand -->
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 md:w-9 md:h-9 rounded-xl bg-[#C94A20] text-white flex items-center justify-center font-black text-base md:text-lg shadow-sm flex-shrink-0">
          T
        </div>
        <div>
          <span class="text-[10px] md:text-xs uppercase tracking-wider font-bold text-[#8B7355] block leading-none">Sagar Sweets</span>
          <span class="text-xs md:text-[13px] font-bold text-[#2C1810]">POS & Expenses</span>
        </div>
      </div>

      <!-- Shop Selector & Actions -->
      <div class="flex items-center gap-2">
        <!-- Shop Selector Dropdown (Admin / SuperAdmin) -->
        <div class="relative" *ngIf="isAdmin || isSuperAdmin; else employeeShopBadge">
          <button (click)="toggleShopDropdown()" 
                  type="button" 
                  class="flex items-center gap-1.5 md:gap-2 px-2.5 md:px-3 py-1.5 rounded-full bg-[#FFF5EE] border border-[#E8D5C8] hover:border-[#C94A20] text-[#2C1810] text-xs font-semibold transition-all shadow-sm">
            <i class="bi bi-shop text-[#C94A20]"></i>
            <span class="max-w-[120px] md:max-w-[200px] truncate">
              {{ (shopService.selectedShop$ | async)?.shoP_NAME || 'Select Shop' }}
            </span>
            <i class="bi bi-chevron-down text-[10px] text-gray-500"></i>
          </button>

          <!-- Dropdown Menu -->
          <div *ngIf="showShopDropdown" 
               class="absolute right-0 mt-2 w-64 bg-white rounded-2xl shadow-xl border border-gray-100 py-2 z-50 overflow-hidden">
            <div class="px-3 py-1.5 border-b border-gray-100 flex items-center justify-between text-[11px] font-bold text-gray-400 uppercase tracking-wider">
              <span>Switch Branch</span>
              <a routerLink="/tejas/shops" (click)="showShopDropdown = false" class="text-[#C94A20] hover:underline normal-case font-semibold">Manage</a>
            </div>
            <div class="max-h-56 overflow-y-auto py-1">
              <button *ngFor="let s of (shopService.shops$ | async)" 
                      (click)="selectShop(s)" 
                      type="button"
                      class="w-full text-left px-3 py-2 text-xs flex items-center justify-between hover:bg-[#FFF5EE] transition-colors"
                      [class.bg-[#FFF5EE]]="s.tejaS_SHOPES_ID === shopService.currentShopId"
                      [class.font-bold]="s.tejaS_SHOPES_ID === shopService.currentShopId">
                <div class="flex items-center gap-2 truncate">
                  <i class="bi bi-building text-gray-400" [class.text-[#C94A20]]="s.tejaS_SHOPES_ID === shopService.currentShopId"></i>
                  <span class="truncate">{{ s.shoP_NAME }}</span>
                </div>
                <i *ngIf="s.tejaS_SHOPES_ID === shopService.currentShopId" class="bi bi-check2 text-[#C94A20] font-bold"></i>
              </button>
            </div>
            <div class="border-t border-gray-100 pt-1 px-2">
              <a routerLink="/tejas/shops" (click)="showShopDropdown = false" class="flex items-center gap-2 w-full px-2 py-1.5 rounded-lg text-xs font-semibold text-[#2b5c2e] hover:bg-green-50 transition-colors">
                <i class="bi bi-gear"></i>
                <span>Shop Management</span>
              </a>
            </div>
          </div>
        </div>

        <!-- Employee Shop Badge -->
        <ng-template #employeeShopBadge>
          <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#E8F5E9] text-[#2B5C2E] text-xs font-semibold border border-[#C8E6C9]">
            <i class="bi bi-shop"></i>
            <span class="max-w-[130px] truncate">{{ (shopService.selectedShop$ | async)?.shoP_NAME || 'Main Branch' }}</span>
          </div>
        </ng-template>

        <!-- Shops link for Admin / SuperAdmin -->
        <a *ngIf="isAdmin || isSuperAdmin" routerLink="/tejas/shops" title="Manage Shops" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-500 hover:text-[#C94A20] hover:bg-[#FFF5EE] transition-all">
          <i class="bi bi-buildings"></i>
        </a>
      </div>
    </div>
  </header>

  <router-outlet></router-outlet>
  
  <!-- DEFAULT NAVIGATION -->
  <nav *ngIf="!isExpenseModule" class="fixed bottom-0 left-0 right-0 h-[72px] bg-white flex items-center justify-around shadow-[0_-2px_16px_rgba(44,24,16,0.08)] z-50 px-1 pb-[env(safe-area-inset-bottom,0)]">
    <a routerLink="/tejas/dashboard" routerLinkActive="!text-[#C94A20] !font-bold" [routerLinkActiveOptions]="{exact: true}" class="flex flex-col items-center gap-1 p-2 rounded-xl text-[#8B7355] transition-all hover:text-[#C94A20] hover:bg-[#FDE8DD] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">Dashboard</span>
    </a>

    <a routerLink="/tejas/billing" routerLinkActive="!text-[#C94A20] !font-bold" class="flex flex-col items-center gap-1 p-2 rounded-xl text-[#8B7355] transition-all hover:text-[#C94A20] hover:bg-[#FDE8DD] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">Billing</span>
    </a>

    <a routerLink="/tejas/entries" routerLinkActive="!text-[#C94A20] !font-bold" class="flex flex-col items-center gap-1 p-2 rounded-xl text-[#8B7355] transition-all hover:text-[#C94A20] hover:bg-[#FDE8DD] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14,2 14,8 20,8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10,9 9,9 8,9"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">Entries</span>
    </a>

    <a routerLink="/tejas/food-master" routerLinkActive="!text-[#C94A20] !font-bold" class="flex flex-col items-center gap-1 p-2 rounded-xl text-[#8B7355] transition-all hover:text-[#C94A20] hover:bg-[#FDE8DD] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8h1a4 4 0 010 8h-1"/>
        <path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/>
        <line x1="6" y1="1" x2="6" y2="4"/>
        <line x1="10" y1="1" x2="10" y2="4"/>
        <line x1="14" y1="1" x2="14" y2="4"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">Food Master</span>
    </a>

    <a routerLink="/tejas/printer" routerLinkActive="!text-[#C94A20] !font-bold" class="flex flex-col items-center gap-1 p-2 rounded-xl text-[#8B7355] transition-all hover:text-[#C94A20] hover:bg-[#FDE8DD] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6,9 6,2 18,2 18,9"/>
        <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">Printer</span>
    </a>
  </nav>

  <!-- EXPENSE MODULE NAVIGATION -->
  <nav *ngIf="isExpenseModule" class="fixed bottom-0 left-0 right-0 h-[72px] bg-white flex items-center justify-around shadow-[0_-2px_16px_rgba(44,24,16,0.08)] z-50 px-1 pb-[env(safe-area-inset-bottom,0)]">
    <a routerLink="/tejas/dashboard" routerLinkActive="!text-[#2b5c2e] !font-bold" [routerLinkActiveOptions]="{exact: true}" class="flex flex-col items-center gap-1 p-2 rounded-xl text-gray-500 transition-all hover:text-[#2b5c2e] hover:bg-[#e8f5e9] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">Dashboard</span>
    </a>

    <a routerLink="/tejas/expenses" routerLinkActive="!text-[#2b5c2e] !font-bold" class="flex flex-col items-center gap-1 p-2 rounded-xl text-gray-500 transition-all hover:text-[#2b5c2e] hover:bg-[#e8f5e9] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="2" ry="2"/>
        <line x1="12" y1="8" x2="12" y2="16"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">Add Entry</span>
    </a>

    <a routerLink="/tejas/history" routerLinkActive="!text-[#2b5c2e] !font-bold" class="flex flex-col items-center gap-1 p-2 rounded-xl text-gray-500 transition-all hover:text-[#2b5c2e] hover:bg-[#e8f5e9] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">History</span>
    </a>

    <a routerLink="/tejas/ex-entrytype" routerLinkActive="!text-[#2b5c2e] !font-bold" class="flex flex-col items-center gap-1 p-2 rounded-xl text-gray-500 transition-all hover:text-[#2b5c2e] hover:bg-[#e8f5e9] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/>
        <line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">Entry Type</span>
    </a>

    <a routerLink="/tejas/tejas-users" routerLinkActive="!text-[#2b5c2e] !font-bold" class="flex flex-col items-center gap-1 p-2 rounded-xl text-gray-500 transition-all hover:text-[#2b5c2e] hover:bg-[#e8f5e9] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">Users</span>
    </a>
  </nav>
</div>
