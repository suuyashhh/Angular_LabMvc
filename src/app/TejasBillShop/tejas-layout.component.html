<div class="tejas-layout min-h-screen bg-[#FDF6F0] relative pb-20 font-sans">
  <router-outlet></router-outlet>
  
  <nav class="fixed bottom-0 left-0 right-0 h-[72px] bg-white flex items-center justify-around shadow-[0_-2px_16px_rgba(44,24,16,0.08)] z-50 px-1 pb-[env(safe-area-inset-bottom,0)]">
    <a routerLink="/tejas/dashboard" routerLinkActive="!text-[#C94A20] !font-bold" [routerLinkActiveOptions]="{exact: true}" class="flex flex-col items-center gap-1 p-2 rounded-xl text-[#8B7355] transition-all hover:text-[#C94A20] hover:bg-[#FDE8DD] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">Dashboard</span>
    </a>

    <a routerLink="/tejas/billing" routerLinkActive="!text-[#C94A20] !font-bold" class="flex flex-col items-center gap-1 p-2 rounded-xl text-[#8B7355] transition-all hover:text-[#C94A20] hover:bg-[#FDE8DD] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">Billing</span>
    </a>

    <a routerLink="/tejas/entries" routerLinkActive="!text-[#C94A20] !font-bold" class="flex flex-col items-center gap-1 p-2 rounded-xl text-[#8B7355] transition-all hover:text-[#C94A20] hover:bg-[#FDE8DD] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14,2 14,8 20,8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10,9 9,9 8,9"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">Entries</span>
    </a>

    <a routerLink="/tejas/food-master" routerLinkActive="!text-[#C94A20] !font-bold" class="flex flex-col items-center gap-1 p-2 rounded-xl text-[#8B7355] transition-all hover:text-[#C94A20] hover:bg-[#FDE8DD] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8h1a4 4 0 010 8h-1"/>
        <path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/>
        <line x1="6" y1="1" x2="6" y2="4"/>
        <line x1="10" y1="1" x2="10" y2="4"/>
        <line x1="14" y1="1" x2="14" y2="4"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">Food Master</span>
    </a>

    <a routerLink="/tejas/printer" routerLinkActive="!text-[#C94A20] !font-bold" class="flex flex-col items-center gap-1 p-2 rounded-xl text-[#8B7355] transition-all hover:text-[#C94A20] hover:bg-[#FDE8DD] min-w-[60px]">
      <svg class="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6,9 6,2 18,2 18,9"/>
        <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      <span class="text-[11px] font-semibold tracking-[0.2px]">Printer</span>
    </a>
  </nav>
</div>
