<div class="min-h-screen bg-zinc-50 flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="mt-6 text-center text-2xl sm:text-3xl font-extrabold text-zinc-900">
      Main Admin Login
    </h2>
    <p class="mt-2 text-center text-sm text-zinc-600">
      Access the master dashboard
    </p>
  </div>

  <div class="mt-8 mx-auto w-full max-w-md sm:max-w-md">
    <div class="bg-white py-8 px-6 shadow sm:rounded-lg sm:px-10 border border-zinc-200">
      <form class="space-y-6" (ngSubmit)="onSubmit()">
        <div *ngIf="errorMessage" class="rounded-md bg-red-50 p-4 mb-4">
          <div class="flex">
            <div class="ml-3">
              <h3 class="text-sm font-medium text-red-800">{{ errorMessage }}</h3>
            </div>
          </div>
        </div>

        <div>
          <label for="username" class="block text-sm font-medium text-zinc-700">
            Username
          </label>
          <div class="mt-1">
            <input id="username" name="username" type="text" autocomplete="username" required
              [(ngModel)]="username"
              class="appearance-none block w-full px-3 py-2 border border-zinc-300 rounded-md shadow-sm placeholder-zinc-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-zinc-700">
            Password
          </label>
          <div class="mt-1">
            <input id="password" name="password" type="password" autocomplete="current-password" required
              [(ngModel)]="password"
              class="appearance-none block w-full px-3 py-2 border border-zinc-300 rounded-md shadow-sm placeholder-zinc-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
          </div>
        </div>

        <div>
          <button type="submit"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-zinc-900 hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-zinc-900 transition-colors">
            Sign in
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
