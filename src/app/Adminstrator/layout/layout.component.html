<div class="flex h-screen bg-zinc-50 overflow-hidden relative">
  
  <!-- Mobile Sidebar Overlay -->
  <div *ngIf="isSidebarOpen" (click)="closeSidebar()" class="fixed inset-0 bg-zinc-900/50 z-20 md:hidden transition-opacity"></div>

  <!-- Sidebar -->
  <div [class.translate-x-0]="isSidebarOpen" [class.-translate-x-full]="!isSidebarOpen" class="w-64 bg-zinc-900 text-white flex flex-col shadow-xl flex-shrink-0 z-30 fixed inset-y-0 left-0 transform transition-transform duration-300 md:relative md:translate-x-0">
    <div class="h-16 flex items-center justify-between px-6 border-b border-zinc-800">
      <div class="flex items-center">
        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center mr-3 shadow-sm">
          <i class="fas fa-shield-alt text-white"></i>
        </div>
        <h1 class="text-xl font-bold tracking-wider text-zinc-100">ADMIN PANEL</h1>
      </div>
      <!-- Close button for mobile -->
      <button (click)="closeSidebar()" class="md:hidden text-zinc-400 hover:text-white">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>
    
    <div class="flex-1 overflow-y-auto py-6">
      <div class="px-4 mb-4 text-xs font-semibold text-zinc-500 uppercase tracking-wider">
        Main Menu
      </div>
      <nav class="px-3 space-y-2">
        <a routerLink="/admin/dashboard" (click)="closeSidebar()" routerLinkActive="bg-indigo-600/10 text-indigo-400 border-indigo-600" [routerLinkActiveOptions]="{exact: true}" class="flex items-center px-3 py-2.5 rounded-lg text-zinc-400 hover:bg-zinc-800 hover:text-white transition-all duration-200 group border-l-2 border-transparent">
          <i class="fas fa-tachometer-alt mr-3 group-hover:scale-110 transition-transform"></i>
          <span class="font-medium">Dashboard</span>
        </a>
        
        <a routerLink="/admin/project-master" (click)="closeSidebar()" routerLinkActive="bg-indigo-600/10 text-indigo-400 border-indigo-600" class="flex items-center px-3 py-2.5 rounded-lg text-zinc-400 hover:bg-zinc-800 hover:text-white transition-all duration-200 group border-l-2 border-transparent">
          <i class="fas fa-project-diagram mr-3 group-hover:scale-110 transition-transform"></i>
          <span class="font-medium">Project Master</span>
        </a>
      </nav>
    </div>
    
    <div class="p-4 border-t border-zinc-800 bg-zinc-900/50">
      <div class="flex items-center justify-between px-2">
        <div class="flex items-center">
          <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-sm font-bold shadow-md">
            A
          </div>
          <div class="ml-3">
            <p class="text-sm font-medium text-white">Administrator</p>
            <p class="text-xs text-zinc-400">admin&#64;system.com</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden relative">
    <!-- Header -->
    <header class="h-16 bg-white shadow-sm border-b border-zinc-200 flex items-center justify-between px-4 sm:px-6 z-10 sticky top-0 flex-shrink-0">
      <div class="flex items-center">
        <!-- Hamburger Menu Button -->
        <button (click)="toggleSidebar()" class="md:hidden mr-4 p-2 text-zinc-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-md transition-colors">
          <i class="fas fa-bars text-lg"></i>
        </button>
        <!-- Breadcrumb / Title area -->
        <h2 class="text-lg font-semibold text-zinc-800 hidden sm:block">Control Center</h2>
      </div>
      <div class="flex items-center space-x-2 sm:space-x-4">
        <button class="p-2 text-zinc-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-full transition-colors relative">
          <i class="fas fa-bell"></i>
          <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
        </button>
        <div class="h-8 w-px bg-zinc-200 hidden sm:block"></div>
        <button (click)="logout()" class="flex items-center text-sm font-medium text-zinc-600 hover:text-red-600 transition-colors px-2 sm:px-3 py-1.5 rounded-md hover:bg-red-50">
          <i class="fas fa-sign-out-alt mr-1 sm:mr-2"></i> <span class="hidden sm:inline">Logout</span>
        </button>
      </div>
    </header>

    <!-- Scrollable Content -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-zinc-50/50 p-4 sm:p-6 relative w-full">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
