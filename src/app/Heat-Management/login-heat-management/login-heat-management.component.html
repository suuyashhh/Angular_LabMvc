<div class="login-page">
  <div class="login-shell">

    <!-- RIGHT: Login card -->
    <section class="card-side">
      <div class="login-card">

        <!-- Logo -->
        <div class="brand">
          <div class="brand-logo">
            <img
              src="assets/img/Heat-Management/logo.png"
              alt=""
              (error)="$any($event.target).style.display = 'none'" />
          </div>
          <div class="brand-text">
            <span class="brand-name">THERMO-RECOVER</span>
            <span class="brand-sub">Waste Heat Management System</span>
          </div>
        </div>

        <h1 class="card-title">Welcome back!</h1>
        <p class="card-subtitle">Please enter your details.</p>

        <!-- Error -->
        <div *ngIf="errorMessage" class="error-banner" role="alert">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Form -->
        <form (ngSubmit)="login()" class="login-form" novalidate>

          <div class="form-group">
            <label for="username" class="form-label">Work Email</label>
            <input
              type="text"
              id="username"
              name="username"
              [(ngModel)]="loginData.username"
              placeholder="name@company.com"
              required
              autocomplete="username"
              class="form-input" />
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="password" class="form-label">Password</label>
              <button type="button" class="forgot-link" (click)="onForgotPassword()">
                Forgot password?
              </button>
            </div>
            <div class="input-wrapper">
              <input
                [type]="showPassword ? 'text' : 'password'"
                id="password"
                name="password"
                [(ngModel)]="loginData.password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
                class="form-input has-toggle" />
              <button
                type="button"
                class="password-toggle-btn"
                (click)="togglePasswordVisibility()"
                [title]="showPassword ? 'Hide password' : 'Show password'"
                aria-label="Toggle password visibility">
                <i class="fa-solid" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
              </button>
            </div>
          </div>

          <label class="checkbox-label">
            <input
              type="checkbox"
              name="rememberMe"
              [(ngModel)]="loginData.rememberMe"
              class="custom-checkbox" />
            <span>Remember for 30 days</span>
          </label>

          <button type="submit" class="submit-btn" [disabled]="isLoading">
            <span *ngIf="!isLoading">Sign in</span>
            <span *ngIf="isLoading" class="btn-loading">
              <i class="fa-solid fa-circle-notch fa-spin"></i>
              Signing in...
            </span>
          </button>

          <button type="button" class="google-btn">
            <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.5-4.1 7-10.2 7-17.6z"/>
              <path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/>
              <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
            </svg>
            <span>Sign in with Google</span>
          </button>
        </form>

        <p class="signup-row">
          Don't have an account?
          <a routerLink="/register" class="signup-link">Sign up</a>
        </p>

        <div class="card-footer">
          <a routerLink="/portfolio" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Return to Portfolio</span>
          </a>
        </div>

      </div>
    </section>

  </div>
</div>
