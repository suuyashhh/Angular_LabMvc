<aside 
  class="heat-sidebar bg-[#070e1a] border-r border-[#152338] flex flex-col transition-all duration-200 select-none"
  [ngClass]="isCollapsed ? 'w-14' : 'w-56'">

  <!-- Top Menu Bar Header with Toggle -->
  <div class="h-10 flex items-center px-3 border-b border-[#152338]" [ngClass]="isCollapsed ? 'justify-center' : 'justify-between'">
    <span *ngIf="!isCollapsed" class="text-[10px] font-mono font-bold uppercase tracking-widest text-slate-500">
      Navigation
    </span>

    <button 
      type="button"
      (click)="toggleCollapse()"
      [title]="isCollapsed ? 'Expand Navigation' : 'Collapse Navigation'"
      class="w-6 h-6 rounded bg-[#0b1626] hover:bg-[#12233c] border border-[#1b2b42] text-slate-400 hover:text-slate-200 flex items-center justify-center transition-colors focus:outline-none">
      <i class="fa-solid text-[10px]" [ngClass]="isCollapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
    </button>
  </div>

  <!-- Menu Navigation Links -->
  <nav class="flex-1 py-2 space-y-0.5 overflow-y-auto custom-scrollbar">
    <a 
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active-menu-item"
      [routerLinkActiveOptions]="{ exact: false }"
      [title]="isCollapsed ? item.label : ''"
      class="menu-link group flex items-center gap-3 px-3.5 py-2.5 text-slate-400 hover:text-slate-200 hover:bg-[#0b1628] border-l-2 border-transparent transition-colors font-medium text-xs"
      [ngClass]="isCollapsed ? 'justify-center px-0 py-3' : ''">
      
      <!-- Icon -->
      <div class="w-4 h-4 flex items-center justify-center flex-shrink-0 text-xs text-slate-400 group-hover:text-slate-200">
        <i [class]="item.icon"></i>
      </div>

      <!-- Label text (hidden when collapsed) -->
      <span *ngIf="!isCollapsed" class="tracking-wide whitespace-nowrap text-xs">
        {{ item.label }}
      </span>
    </a>
  </nav>

  <!-- Sidebar Footer Note / Status -->
  <div class="p-2.5 border-t border-[#152338]" *ngIf="!isCollapsed">
    <div class="p-2 rounded bg-[#050c17] border border-[#14233a] text-[10px] font-mono text-slate-400 space-y-0.5">
      <div class="flex items-center justify-between">
        <span class="text-slate-500">GATEWAY</span>
        <span class="text-emerald-400 font-semibold flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          CONNECTED
        </span>
      </div>
      <div class="flex items-center justify-between text-slate-500 text-[9px]">
        <span>PROTOCOL</span>
        <span>IEC 61850</span>
      </div>
    </div>
  </div>

</aside>
